[package]
name = "satellite-platform"
version = "0.1.0"
edition = "2024"
default-run = "satellite-platform"

[[bin]]
name = "gen-openapi"
path = "./src/api_docgen.rs"
required-features = ["openapi"]

[lib]
name = "satellite"

[features]
default = []
openapi = ["dep:utoipa", "dep:dedent"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["core-error", "now", "serde"] }
dedent = { version = "0.1.1", optional = true }
heed = {
    version = "=0.22.1", # >0.22.1 Will include LLM authored commit `275b9ea`.
    default-features = false,
    features = ["serde", "serde-rmp"]
}
log = "0.4.34"
percent-encoding = "2.3.2"
pollster = "1.0.1"
pretty_env_logger = "0.5.0"

# test test::cmark       ... bench:      27,769.90 ns/iter (+/- 263.10)
# test test::markdown_rs ... bench:   1,440,134.05 ns/iter (+/- 47,630.34)
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["json", "runtime-tokio", "sqlite"] }
tokio = { version = "1.53.1", features = ["macros", "parking_lot", "rt-multi-thread"] }
toml = "1.1.4"
utoipa = { version = "5.5.0", features = ["chrono", "uuid"], optional = true }
uuid = { version = "1.26.0", features = ["serde", "v4"], default-features = false }
warp = { version = "0.4.3", features = ["compression", "server"] }

[dev-dependencies]
rand = "0.10.2"
warp = { version = "0.4.3", features = ["test"] }
